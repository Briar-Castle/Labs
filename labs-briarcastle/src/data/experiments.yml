# ==================================================================================
#                              EXP-006 SEDES (featured)
#===================================================================================

  - id: "EXP-006"
    slug: "sedes"
    name: "SEDES"
    description: >
      A web application for performing Least Significant Bit (LSB) steganography on PNG images.
      Provides secure encoding and decoding of hidden messages within images, supported by a React frontend and a FastAPI backend.

    status: "active"
    featured: false
    visibility: "public"

    version: "0.1.0"

    created: 2026-07-07
    updated: 2026-07-07
    published: 2026-07-07

    category: [ "website", "utility-tool" ]
    stack:
      bundler: "Vite"
      frameworks: ["React", "FastAPI"]
      third_party:
        libraries: [
          fastapi (python),
          uvicorn (python),
          pydantic (python),
          email-validator (python),
          pillow (python),
          sqlalchemy (python),
          asyncpg (python),
          cryptography (python),
          bcrypt (python),
          python-multipart (python),
        ]
        components: [
          react-router-dom,
        ]
      platforms: # optional
        web: # optional
          backend: [Railway] # optional
          frontend: [Vercel] # optional
      languages: ["JavaScript", "Python"] # optional

    topics:
